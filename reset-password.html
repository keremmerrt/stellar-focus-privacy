<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Stellar Focus</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; background: #0A0820; color: #fff; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1a1836; border: 1px solid #2d2b55; border-radius: 16px; padding: 32px; width: 100%; max-width: 380px; }
    h2 { margin: 0 0 8px; font-size: 22px; }
    p { color: #a0a0c0; margin: 0 0 24px; font-size: 14px; }
    input { width: 100%; padding: 12px 14px; background: #0d0b1e; border: 1px solid #2d2b55; border-radius: 8px; color: #fff; font-size: 15px; box-sizing: border-box; margin-bottom: 12px; }
    button { width: 100%; padding: 14px; background: #7C6FFF; border: none; border-radius: 10px; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    .msg { margin-top: 12px; font-size: 13px; text-align: center; min-height: 18px; }
    .err { color: #ff6b8a; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
<div class="card">
  <h2>⭐ Stellar Focus</h2>
  <p>Enter your new password below.</p>
  <input type="password" id="pw" placeholder="New password" minlength="6">
  <input type="password" id="pw2" placeholder="Confirm password" minlength="6">
  <button id="btn" onclick="doReset()">Set New Password</button>
  <div class="msg" id="msg"></div>
</div>
<script>
  const { createClient } = supabase;
  const sb = createClient(
    'https://niedribbmoxmmmcanmdg.supabase.co',
    'sb_publishable_VpBoiVFa3j0PzfqETkGlLg_qw3oXuOL'
  );

  const hash = Object.fromEntries(new URLSearchParams(window.location.hash.slice(1)));

  (async () => {
    if (hash.access_token && hash.refresh_token) {
      await sb.auth.setSession({ access_token: hash.access_token, refresh_token: hash.refresh_token });
    }
  })();

  async function doReset() {
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');
    if (pw.length < 6) { msg.className = 'msg err'; msg.textContent = 'Minimum 6 characters.'; return; }
    if (pw !== pw2) { msg.className = 'msg err'; msg.textContent = 'Passwords do not match.'; return; }
    btn.disabled = true;
    msg.textContent = '';
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) {
      msg.className = 'msg err'; msg.textContent = error.message;
      btn.disabled = false;
    } else {
      msg.className = 'msg ok'; msg.textContent = '✓ Password updated! You can now log in from the app.';
      btn.disabled = true;
    }
  }
</script>
</body>
</html>
